name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_flags: ""
          - os: macos-latest
            cargo_flags: ""
          - os: windows-latest
            cargo_flags: "--release"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test ${{ matrix.cargo_flags }} --locked --verbose

  release:
    name: Build & Release (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ''
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ''
            use_cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            exe_suffix: ''
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            exe_suffix: ''
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            exe_suffix: .exe
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binaries
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Prepare artifacts (Unix)
        id: package_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive_name="nactl-${GITHUB_REF_NAME}-${{ matrix.target }}"
          staging_dir="dist"
          mkdir -p "${staging_dir}"
          cp "target/${{ matrix.target }}/release/nactl${{ matrix.exe_suffix }}" "${staging_dir}/"
          cp README.md README.zh-CN.md "${staging_dir}/"
          tar czvf "${archive_name}.tar.gz" -C "${staging_dir}" .
          echo "archive=${archive_name}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Prepare artifacts (Windows)
        id: package_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "nactl-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          $stagingDir = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nactl${{ matrix.exe_suffix }}" $stagingDir
          Copy-Item README.md $stagingDir
          Copy-Item README.zh-CN.md $stagingDir
          Compress-Archive -Path "$stagingDir/*" -DestinationPath "$archiveName.zip" -Force
          "archive=$archiveName.zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nactl-${{ matrix.target }}
          path: ${{ runner.os == 'Windows' && steps.package_windows.outputs.archive || steps.package_unix.outputs.archive }}

  publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}